<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" fill="none">
  <!-- Cornerstone Geometric Faceted Emblem -->
  <g class="cornerstone-mark">
    <defs>
      <linearGradient id="csOrangeGradAsset" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF824D" />
        <stop offset="100%" stop-color="#FF6B2C" />
      </linearGradient>
      <linearGradient id="csWhiteGradAsset" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#E2E8F0" />
      </linearGradient>
      <linearGradient id="csSlateGradAsset" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#94A3B8" />
        <stop offset="100%" stop-color="#64748B" />
      </linearGradient>
    </defs>
    
    <!-- Foundation Base / Cube Base -->
    <path d="M28 8 L48 19 L28 30 L8 19 Z" fill="url(#csWhiteGradAsset)" opacity="0.95" />
    <path d="M8 19 L28 30 L28 54 L8 43 Z" fill="url(#csOrangeGradAsset)" />
    <path d="M28 30 L48 19 L48 43 L28 54 Z" fill="url(#csSlateGradAsset)" opacity="0.85" />
    
    <!-- Central Cross & Foundation Stone Details -->
    <path d="M28 14 L28 48" stroke="#080B12" stroke-width="2" stroke-linecap="round" opacity="0.65" />
    <path d="M16 23 L40 23" stroke="#080B12" stroke-width="2" stroke-linecap="round" opacity="0.65" />
    <circle cx="28" cy="23" r="2.5" fill="#FF6B2C" />
  </g>

  <!-- Typography: CORNERSTONE -->
  <text x="64" y="32" fill="#F5F2EE" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="0.12em">CORNERSTONE</text>
  
  <!-- Subtitle Tagline: Built on Christ, Open to Everyone -->
  <text x="65" y="49" fill="#B0B7C3" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5" letter-spacing="0.18em">BUILT ON CHRIST, OPEN TO EVERYONE</text>
</svg>
