<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Cornerstone Church</title>
    <script>
      (function() {
        var path = window.location.pathname;
        
        // Never redirect for static files (scripts, stylesheets, images, fonts)
        if (/\.[a-zA-Z0-9]+$/.test(path) || path.indexOf('/assets/') !== -1) {
          return;
        }

        var origin = window.location.origin;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var segments = path.split('/').filter(Boolean);

        // For GitHub Pages subpath (e.g. /repo-name/page -> /repo-name/#/page)
        if (segments.length > 1) {
          var repo = segments[0];
          var route = segments.slice(1).join('/');
          window.location.replace(origin + '/' + repo + '/#/' + route + search + hash);
        } else if (segments.length === 1) {
          // If only /repo-name was visited without trailing slash
          var repo = segments[0];
          window.location.replace(origin + '/' + repo + '/' + search + hash);
        } else {
          window.location.replace(origin + '/#' + search + hash);
        }
      })();
    </script>
  </head>
  <body style="background-color: #080B12; color: #F5F2EE; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Loading Cornerstone Church...</p>
  </body>
</html>
